<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#7a4b1e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Feed My Sheep"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Feed My Sheep – Sermons & Ministry Planner</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#2b2418;--mute:#7a6f5d;--acc:#7a4b1e;--acc2:#e8d9bf;--ok:#2f7d4f;--line:#e5dcc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130e;--card:#221c14;--ink:#f1e9da;--mute:#a89b84;--acc:#e0a96a;--acc2:#3a2f20;--ok:#6fd39a;--line:#3a3023;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130e;--card:#221c14;--ink:#f1e9da;--mute:#a89b84;--acc:#e0a96a;--acc2:#3a2f20;--ok:#6fd39a;--line:#3a3023;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif;max-width:720px;margin:auto;padding:0 14px 90px}
header{padding:18px 0 8px}h1{margin:0;font-size:26px;color:var(--acc)}
.verse{color:var(--mute);font-style:italic;font-size:14px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--acc);color:var(--bg);cursor:pointer}
button.sec{background:var(--acc2);color:var(--ink)}button.sm{padding:5px 10px;font-size:13px}
.months{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.months button{background:var(--acc2);color:var(--ink);white-space:nowrap;padding:7px 12px}
.months button.on{background:var(--acc);color:var(--bg)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{flex:1;background:none;color:var(--mute);border-radius:0;padding:10px 0}
.tabs button.on{color:var(--acc);border-bottom:3px solid var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:17px}.meta{color:var(--mute);font-size:13px}
.tag{display:inline-block;background:var(--acc2);border-radius:99px;padding:1px 9px;font-size:12px;margin-right:4px}
.done h3{text-decoration:line-through;opacity:.6}.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid .card{cursor:pointer;margin:0}.empty{text-align:center;color:var(--mute);padding:30px 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:14px 20px;box-shadow:0 4px 14px #0004}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}
.modal.show{display:flex}.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
</style></head><body>
<header>
<div class="row"><div style="flex:1"><h1>🐑 Feed My Sheep</h1><div class="verse">“Feed my sheep.” — John 21:17</div></div>
<select id="yr" style="width:90px"></select></div>
</header>
<div class="months" id="months"></div>
<div class="tabs" id="tabs"></div>
<input id="q" placeholder="Search title, scripture, notes…" style="margin-bottom:12px">
<div class="card" id="spc" style="display:none"><h3>✨ Gathering of Angels</h3><div class="meta">Special service / occasional celebration. Add it here, or plan other special occasions.</div><button class="sm" style="margin-top:8px" onclick="quickGA()">＋ Add Gathering of Angels</button></div>
<div id="list"></div>
<div id="ideas"></div>
<button class="fab" id="add">＋ Add</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MIN=["Worship","Prayer","Youth","Children","Women","Men","Outreach","Counseling","Visitation","Choir/Music","Bible Study","Other"];
const OCC=["Gathering of Angels","Easter","Christmas","Harvest/Thanksgiving","Watchnight/Crossover","Anniversary","Convention/Revival","Wedding/Dedication","Other"];
const SS=["Idea","Preparing","Ready","Preached"],MS=["Planned","In progress","Done"];
let S={sermons:[],acts:[],special:[]};
try{const r=localStorage.getItem("fms");if(r)S=JSON.parse(r)}catch(e){}
S.special=S.special||[];
const arr=()=>tab=="sermons"?S.sermons:tab=="acts"?S.acts:S.special;
const save=()=>{try{localStorage.setItem("fms",JSON.stringify(S))}catch(e){}};
const now=new Date();let year=now.getFullYear(),month=now.getMonth(),tab="sermons";
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mOf=d=>d?new Date(d+"T00:00").getMonth():-1,yOf=d=>d?new Date(d+"T00:00").getFullYear():-1;
function fmt(d){return d?new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}):"No date"}
function head(){
$("yr").innerHTML=[year-1,year,year+1,year+2].map(y=>`<option ${y==year?"selected":""}>${y}</option>`).join("");
$("months").innerHTML=M.map((m,i)=>`<button class="${tab!="year"&&i==month?"on":""}" onclick="month=${i};tab=tab=='year'?'sermons':tab;render()">${m.slice(0,3)}</button>`).join("");
$("tabs").innerHTML=[["sermons","Sermons"],["acts","Ministry"],["special","Special"],["year","Year"]].map(([k,v])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${v}</button>`).join("");
$("add").style.display=tab=="year"?"none":"";$("q").style.display=tab=="year"?"none":"";$("spc").style.display=tab=="special"?"":"none";$("ideas").innerHTML=tab=="special"?ideasHTML():""}
function inMonth(x){return yOf(x.date)==year&&mOf(x.date)==month}
function match(x){const q=$("q").value.toLowerCase();return !q||JSON.stringify(x).toLowerCase().includes(q)}
function render(){head();const L=$("list");
if(tab=="year"){L.innerHTML=`<div class="grid">`+M.map((m,i)=>{const s=S.sermons.filter(x=>yOf(x.date)==year&&mOf(x.date)==i),a=S.acts.filter(x=>yOf(x.date)==year&&mOf(x.date)==i),p=S.special.filter(x=>yOf(x.date)==year&&mOf(x.date)==i);
return `<div class="card" onclick="month=${i};tab='sermons';render()"><h3>${m}</h3><div class="meta">${s.length} sermon${s.length==1?"":"s"}<br>${a.length} activit${a.length==1?"y":"ies"}<br>${p.length} special</div><div class="meta ok">${s.filter(x=>x.status=="Preached").length+a.filter(x=>x.status=="Done").length+p.filter(x=>x.status=="Done").length} completed</div></div>`}).join("")+`</div>
<div class="card" style="margin-top:14px"><h3>Backup</h3><div class="meta">Copy this text to keep your data safe, or paste a backup and tap Restore.</div><textarea id="bk" rows="4"></textarea><div class="row" style="margin-top:8px"><button class="sec sm" onclick="$('bk').value=JSON.stringify(S);$('bk').select();try{document.execCommand('copy')}catch(e){}">Copy backup</button><button class="sm" onclick="restore()">Restore</button></div></div><div class="card"><h3>Install & offline</h3><div class="meta">iPhone: Safari → Share → Add to Home Screen.<br>Android: Chrome menu → Install app.<br>Works offline after the first open.</div></div>`;return}
const items=arr().filter(inMonth).filter(match).sort((a,b)=>a.date<b.date?-1:1);
if(!items.length){L.innerHTML=`<div class="empty">Nothing planned for ${M[month]} ${year} yet.<br>Tap ＋ Add to begin.</div>`;return}
L.innerHTML=items.map(x=>{const fin=x.status=="Preached"||x.status=="Done";
return `<div class="card ${fin?"done":""}"><h3>${x.ministry=="Gathering of Angels"?"✨ ":""}${esc(x.title)}</h3><div class="meta">${fmt(x.date)}${x.time?" · "+esc(x.time):""}${x.speaker?" · "+esc(x.speaker):""}</div>
<div style="margin:6px 0">${x.scripture?`<span class="tag">📖 ${esc(x.scripture)}</span>`:""}${x.series?`<span class="tag">${esc(x.series)}</span>`:""}${x.ministry?`<span class="tag">${esc(x.ministry)}</span>`:""}<span class="tag ${fin?"ok":""}">${esc(x.status)}</span></div>
${x.location?`<div class="meta">📍 ${esc(x.location)}</div>`:""}${x.notes?`<div style="white-space:pre-wrap;font-size:15px;margin-top:6px">${esc(x.notes)}</div>`:""}
<div class="row" style="margin-top:8px"><button class="sec sm" onclick="edit('${x.id}')">Edit</button><button class="sec sm" onclick="adv('${x.id}')">${fin?"Reopen":"Next status ›"}</button><button class="sec sm" onclick="del('${x.id}')">Delete</button></div></div>`}).join("")}
function open_(h){$("sheet").innerHTML=h;$("modal").classList.add("show")}
function close_(){$("modal").classList.remove("show")}
$("modal").onclick=e=>{if(e.target.id=="modal")close_()};
const IDEAS={
"Gathering of Angels":[
{t:"Innumerable Angels, One Church",s:"Hebrews 12:22-24",n:"1) Heaven is not distant: we have come to the city of God. 2) The church and the angels worship together. 3) Jesus, the mediator, is the centre of the gathering."},
{t:"Ministering Spirits Sent for You",s:"Hebrews 1:14; Psalm 91:11",n:"1) Who the angels are and what they do. 2) God sends help to heirs of salvation. 3) We worship God, never the angels."},
{t:"The Angel Who Encamps Around Us",s:"Psalm 34:7",n:"1) The fear of the Lord. 2) God’s protection is active and near. 3) Taste and see that the Lord is good."}],
"Easter":[
{t:"He Is Not Here, He Is Risen",s:"Luke 24:1-12",n:"1) The empty tomb. 2) Remember His words. 3) Go and tell."},
{t:"Because He Lives, Our Labour Is Not in Vain",s:"1 Corinthians 15:20,58",n:"1) Christ the firstfruits. 2) Death is defeated. 3) Stand firm and keep working."}],
"Christmas":[
{t:"Good News of Great Joy",s:"Luke 2:8-14",n:"1) Fear turned to joy. 2) A Saviour for all people. 3) Glory to God, peace on earth."},
{t:"God With Us",s:"Isaiah 9:6; Matthew 1:23",n:"1) The child and the Mighty God. 2) Names that describe His reign. 3) Emmanuel changes how we live."}],
"Harvest/Thanksgiving":[
{t:"Sowing in Tears, Reaping in Joy",s:"Psalm 126:5-6",n:"1) Faithful sowing in hard seasons. 2) God brings the harvest. 3) Bringing the sheaves home."},
{t:"God Loves a Cheerful Giver",s:"2 Corinthians 9:6-8",n:"1) Sowing generously. 2) Giving from the heart. 3) God supplies all we need."}],
"Watchnight/Crossover":[
{t:"His Mercies Are New Every Morning",s:"Lamentations 3:22-23",n:"1) Look back with gratitude. 2) Faithfulness is great. 3) Enter the new year in hope."},
{t:"Forgetting What Is Behind",s:"Philippians 3:13-14; Isaiah 43:18-19",n:"1) Release the past. 2) Press toward the goal. 3) God is doing a new thing."}],
"Anniversary":[
{t:"Thus Far the Lord Has Helped Us",s:"1 Samuel 7:12",n:"1) Raise an Ebenezer. 2) Remember what God has done. 3) Trust Him for the years ahead."},
{t:"The Lord Has Done Great Things for Us",s:"Psalm 126:1-3",n:"1) Testimony of the church. 2) Joy that others notice. 3) Continue the work."}],
"Convention/Revival":[
{t:"Revive Us Again",s:"Habakkuk 3:2; 2 Chronicles 7:14",n:"1) Humble ourselves and pray. 2) Turn from our ways. 3) God heals and restores."},
{t:"Filled and Sent",s:"Acts 2:1-4,38-39",n:"1) Waiting and praying together. 2) The Spirit’s power. 3) The promise is for everyone."}],
"Wedding/Dedication":[
{t:"Two Are Better Than One",s:"Ecclesiastes 4:9-12",n:"1) Partnership and help. 2) Standing together in trouble. 3) The threefold cord with God."},
{t:"Dedicating the House to the Lord",s:"1 Kings 8:22-30",n:"1) God dwells among His people. 2) A house of prayer. 3) Our commitment to Him."}],
"Other":[
{t:"Enter His Gates With Thanksgiving",s:"Psalm 100",n:"1) Worship with joy. 2) Know that the Lord is God. 3) His love endures forever."}]};
function ideasHTML(){return `<h2 style="color:var(--acc);font-size:19px;margin:18px 0 8px">📖 Sermon ideas by occasion</h2>`+Object.keys(IDEAS).map((o,k)=>`<div class="card"><h3>${o=="Gathering of Angels"?"✨ ":""}${o}</h3>`+IDEAS[o].map((x,i)=>`<div style="border-top:1px solid var(--line);padding:8px 0"><b>${x.t}</b><div class="meta">📖 ${x.s}</div><div style="font-size:14px">${x.n}</div><button class="sec sm" style="margin-top:6px" onclick="useIdea(${k},${i})">Add to my sermons</button></div>`).join("")+`</div>`).join("")}
function useIdea(k,i){const o=Object.keys(IDEAS)[k],x=IDEAS[o][i];tab="sermons";render();form({date:`${year}-${String(month+1).padStart(2,"0")}-01`,status:"Idea",title:x.t,scripture:x.s,series:o,notes:x.n})}
function quickGA(){form({date:`${year}-${String(month+1).padStart(2,"0")}-01`,status:"Planned",title:"Gathering of Angels",ministry:"Gathering of Angels"})}
function form(x){const sm=tab=="sermons",st=sm?SS:MS;x=x||{date:`${year}-${String(month+1).padStart(2,"0")}-01`,status:st[0]};
const f=(k,l,t="text")=>`<label>${l}</label><input id="f_${k}" type="${t}" value="${esc(x[k])}">`;
open_(`<h2 style="margin:0;color:var(--acc)">${x.id?"Edit":"New"} ${sm?"sermon":tab=="special"?"special service":"activity"}</h2>${f("title",sm?"Sermon title":"Activity name")}${f("date","Date","date")}${f("time","Time","time")}
${sm?f("scripture","Scripture (e.g. John 21:15-17)")+f("series","Series")+f("speaker","Preacher"):`<label>${tab=="special"?"Occasion":"Ministry"}</label><select id="f_ministry">${(tab=="special"?OCC:MIN).map(m=>`<option ${x.ministry==m?"selected":""}>${m}</option>`).join("")}</select>${f("location","Location")}${tab=="special"?f("speaker","Preacher / host"):""}`}
<label>Status</label><select id="f_status">${st.map(s=>`<option ${x.status==s?"selected":""}>${s}</option>`).join("")}</select>
<label>${sm?"Outline / notes":"Notes / people involved"}</label><textarea id="f_notes" rows="5">${esc(x.notes)}</textarea>
<div class="row" style="margin-top:14px"><button class="sec" onclick="close_()" style="flex:1">Cancel</button><button style="flex:1" onclick="saveF('${x.id||""}')">Save</button></div>`)}
function saveF(id){const g=k=>{const e=$("f_"+k);return e?e.value.trim():undefined};
const o={title:g("title"),date:g("date"),time:g("time"),scripture:g("scripture"),series:g("series"),speaker:g("speaker"),ministry:g("ministry"),location:g("location"),status:g("status"),notes:g("notes")};
if(!o.title){$("f_title").focus();return}
const A=arr();
if(id){Object.assign(A.find(x=>x.id==id),o)}else{o.id=Date.now().toString(36);A.push(o)}
if(o.date){year=yOf(o.date);month=mOf(o.date)}save();close_();render()}
function find(id){return arr().find(x=>x.id==id)}
function edit(id){form(find(id))}
function adv(id){const x=find(id),st=tab=="sermons"?SS:MS,i=st.indexOf(x.status);x.status=i==st.length-1?st[0]:st[i+1];save();render()}
function del(id){if(!confirm("Delete this item?"))return;const k=tab=="sermons"?"sermons":tab=="acts"?"acts":"special";S[k]=S[k].filter(x=>x.id!=id);save();render()}
function restore(){try{const d=JSON.parse($("bk").value);if(d.sermons&&d.acts){S=d;S.special=S.special||[];save();render();alert("Restored.")}else throw 0}catch(e){alert("That backup text isn’t valid.")}}
$("add").onclick=()=>form();$("q").oninput=render;
$("yr").onchange=e=>{year=+e.target.value;render()};
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
