if(!o.name){$("p_name").focus();return}

function send(k){const m=encodeURIComponent(C.text);let d=(C.phone||"").replace(/[^0-9]/g,"");if(d.startsWith("0"))d=(S.cfg.cc||"")+d.slice(1);
if(k=="wa")open(`https://wa.me/${d}?text=${m}`,"_blank");

else if(k=="call")location.href=`tel:${C.phone||""}`;
else{try{navigator.clipboard.writeText(C.text)}catch(e){}$("c_text").select();try{document.execCommand("copy")}catch(e){}note("Copied.")}}

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const nw=(c,sp)=>{const s=new Set();let g=0;while(s.size<3&&g++<99){const v=c+ri(1,4)*sp*(Math.random()<.5?-1:1);if(v>=0&&v!=c)s.add(v)}return[...s]};
const pk=(arr,n,ex)=>sh(arr.filter(x=>x!=ex)).slice(0,n);
const GEN={
aca:[()=>{const a=ri(12,49),b=ri(3,19);return["What is "+a+" × "+b+"?",a*b,nw(a*b,ri(2,10))]},
()=>{const p=[5,10,15,20,25,50][ri(0,5)],n=ri(1,25)*20,c=n*p/100;return["What is "+p+"% of "+n+"?",c,nw(c,ri(1,3))]},
()=>{const a=ri(2,9),x=ri(2,15),b=ri(1,20);return["Solve for x: "+a+"x + "+b+" = "+(a*x+b),x,nw(x,1)]},
()=>{const s=ri(1,20),d=ri(2,9),c=s+4*d;return["What comes next? "+s+", "+(s+d)+", "+(s+2*d)+", "+(s+3*d)+", …",c,nw(c,ri(1,3))]},
()=>{const l=ri(4,25),w=ri(3,20),p=Math.random()<.5,c=p?l*w:2*(l+w);return["A rectangle is "+l+" cm long and "+w+" cm wide. What is its "+(p?"area (cm²)":"perimeter (cm)")+"?",c,nw(c,ri(2,8))]},
()=>{const a=ri(5,30),b=ri(5,30),c=ri(5,30);let d=ri(5,30);d+=(4-(a+b+c+d)%4)%4;const m=(a+b+c+d)/4;return["What is the average of "+a+", "+b+", "+c+" and "+d+"?",m,nw(m,ri(1,3))]}],
ict:[()=>{const n=ri(5,63);return["Convert binary "+n.toString(2)+" to decimal.",n,nw(n,ri(1,5))]},
()=>{const n=ri(5,31);return["Convert decimal "+n+" to binary.",n.toString(2),nw(n,1).map(v=>v.toString(2))]},
()=>{const n=ri(2,16);return["How many bits are in "+n+" bytes?",8*n,nw(8*n,ri(2,6))]},
()=>{const n=ri(10,255);return["What is hexadecimal "+n.toString(16).toUpperCase()+" in decimal?",n,nw(n,ri(1,9))]}],
bible:[()=>{const i=ri(0,64);return["Which book of the Bible comes right after "+BK[i]+"?",BK[i+1],pk(BK,3,BK[i+1])]},
()=>{const i=ri(1,65);return["Which book of the Bible comes right before "+BK[i]+"?",BK[i-1],pk(BK,3,BK[i-1])]},
()=>{const nt=Math.random()<.5,A=nt?BK.slice(39):BK.slice(0,39),B=nt?BK.slice(0,39):BK.slice(39);return["Which of these books is in the "+(nt?"New":"Old")+" Testament?",pk(A,1)[0],pk(B,3)]},
()=>{const n=ri(1,66);return["In the order of the Bible, which book is number "+n+"?",BK[n-1],pk(BK,3,BK[n-1])]}]};
const mk=(c,q,a,w)=>{const o=sh([a,...w]);return{q,o,a:o.indexOf(a),c}};
const genQ=c=>{const g=GEN[c][ri(0,GEN[c].length-1)]();return mk(c,g[0],String(g[1]),g[2].map(String))};
const bankOf=c=>(QB[c]||[]).concat(S.custom.filter(x=>x.c==c).map(x=>[x.q,x.a,...x.w].join("|")));
const kOf=s=>H(s.split("|")[0]);
function buildQuiz(){const out=[],seen=new Set();
for(const c in QUOTA){const need=QUOTA[c],bank=bankOf(c),hasG=!!GEN[c],take=hasG?SHARE[c]:need,got=[];
let f=sh(bank.filter(s=>!S.used[kOf(s)]));
if(f.length<take&&!hasG){bank.forEach(s=>delete S.used[kOf(s)]);f=sh(bank)}
f.slice(0,take).forEach(s=>{const p=s.split("|");got.push(mk(c,p[0],p[1],p.slice(2)))});
let g=0;while(got.length<need&&hasG&&g++<400){const x=genQ(c),k=H(x.q);if(!S.used[k]&&!seen.has(k)&&!got.some(y=>y.q==x.q))got.push(x)}
while(got.length<need)got.push(genQ(c));
got.forEach(x=>{S.used[H(x.q)]=1;seen.add(H(x.q));out.push(x)})}
return sh(out)}

function aiSet(){open_(`<h2 style="margin:0;color:var(--acc)">Assistant settings</h2><label>Gemini API key (stored only on this device, never uploaded)</label><input id="ai_k" type="password" value="${esc(S.ai.key||"")}" placeholder="Paste your key to use Gemini directly"><div class="row"><button type="button" class="hint" aria-label="More information" aria-expanded="false" onclick="tip(this)">⟦info⟧</button></div><div class="hintp" hidden>With a key here, the assistant talks to Gemini directly and no proxy is needed.</div><label>Proxy link (optional, Google Apps Script web app)</label><input id="ai_u" value="${esc(S.ai.url)}" placeholder="https://script.google.com/macros/s/…/exec"><label>Access code (if the admin set one)</label><input id="ai_c" value="${esc(S.ai.code)}"><label><input type="checkbox" id="ai_s" ${S.ai.search?"checked":""}>Use Google Search for current affairs</label><div class="meta" id="ai_st" style="margin:8px 0"></div><div class="card" style="margin:10px 0"><h3>⟦flask⟧ Models</h3><div class="meta" id="ai_cur"></div><div class="row" style="flex-wrap:wrap;margin:8px 0"><button class="sec sm" onclick="aiLoad()">Load models</button><button class="sec sm" onclick="aiRecheck().then(aiCur)">Auto-select best</button></div><select id="ai_m"><option value="">Load models first</option></select><label>Test question</label><input id="ai_mp" value="Explain photosynthesis in one sentence."><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="sm" onclick="aiMTest()">Test selected</button><button class="sm" onclick="aiMUse()">Use selected</button></div><div class="meta" id="ai_mt" style="margin-top:8px;white-space:pre-wrap"></div></div><div class="row" style="flex-wrap:wrap"><button class="sm" onclick="aiSave()">Save</button><button class="sec sm" onclick="aiTest()">Test connection</button><button class="sec sm" onclick="aiRecheck()">Admin: re-check models</button><button class="sec sm" onclick="close_()">Close</button></div>`)}
function aiSave(){S.ai.key=$("ai_k").value.trim();S.ai.url=$("ai_u").value.trim();S.ai.code=$("ai_c").value.trim();S.ai.search=$("ai_s").checked;save();$("ai_st").textContent="Saved.";render()}
async function aiTest(){aiSave();$("ai_st").textContent="Testing…";try{const j=await aiCall({action:"status"});$("ai_st").textContent=j.ok?(j.hasKey?"⟦checkc⟧ Connected. "+(j.model?"Saved model: "+j.model:"No model saved yet; the first question will select one."):"⟦alert⟧ Proxy reached, but the Gemini API key is not set in its Script Properties."):"⟦alert⟧ "+aiErr(j)}catch(e){$("ai_st").textContent="⟦alert⟧ Could not reach the proxy link."}}
async function aiRecheck(){aiCur();const k=S.ai.key?"local":await askInput({title:"Admin key needed",label:"Admin key (the proxy’s ADMIN_KEY property)",ok:"Use key",cancel:"Cancel"});if(!k)return;$("ai_st").textContent="Testing models with real requests…";try{const j=await aiCall({action:"select",adminKey:k});$("ai_st").textContent=j.ok?"⟦checkc⟧ Selected and saved: "+j.model+" (tested "+j.tested.map(t=>t.model+" "+t.code).join(", ")+")":"⟦alert⟧ "+aiErr(j)}catch(e){$("ai_st").textContent="⟦alert⟧ Could not reach the proxy link."}}

const GEMB="https://generativelanguage.googleapis.com/v1beta/";
const AI_SYS="You are a helpful, honest, general-purpose AI assistant inside the Feed My Sheep app. Answer questions on any legitimate subject, including general knowledge, education, business, finance, science, technology, mathematics, health education, history, current affairs, Bible studies, writing, translation, programming and everyday problem-solving. Be clear, accurate and kind, and reply in the language the user writes in. For health, legal and financial topics give useful general information and say when a qualified professional should be consulted. If you are unsure, say so instead of guessing. Never refuse a legitimate question just because it is not about Christianity.";
async function gmf(path,payload){const h={"x-goog-api-key":S.ai.key};if(payload)h["Content-Type"]="application/json";const r=await fetch(GEMB+path,{method:payload?"POST":"GET",headers:h,body:payload?JSON.stringify(payload):undefined});let j={};try{j=await r.json()}catch(e){}return{code:r.status,json:j}}
const gmText=j=>{const c=j.candidates&&j.candidates[0];return c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||"").join(""):""};
function gmScore(n){const m=n.match(/^gemini-(\d+(?:\.\d+)?)-(flash-lite|flash|pro)/);if(!m)return-1;let s={"flash":300,"flash-lite":200,"pro":100}[m[2]]+parseFloat(m[1])*10;if(/preview|exp|thinking/.test(n))s-=15;return s}
const gmKeyBad=r=>r.code==401||r.code==403||(r.code==400&&/api key/i.test((r.json.error&&r.json.error.message)||""));
async function gmPick(){const l=await gmf("models?pageSize=200");
if(l.code!=200)return{error:l.code==429?"quota":gmKeyBad(l)?"key":"gemini",message:gmKeyBad(l)?"Gemini rejected the API key. Check that it is correct.":(l.json.error&&l.json.error.message)||"Could not list models (HTTP "+l.code+")."};
const c=(l.json.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,"")).filter(n=>gmScore(n)>0&&!/(image|tts|audio|live|embedding)/.test(n)).sort((a,b)=>gmScore(b)-gmScore(a)).slice(0,8);
const tested=[],ok=[];
for(const m of c){const r=await gmf("models/"+m+":generateContent",{contents:[{role:"user",parts:[{text:"Reply with the single word OK."}]}],generationConfig:{maxOutputTokens:128}});tested.push({model:m,code:r.code});if(r.code==200&&r.json.candidates){ok.push(m);if(ok.length>=3)break}}
if(!ok.length)return{error:"no_model",message:"No Gemini model answered a test request. The key may be invalid, or the free quota may be used up.",tested};
S.ai.model=ok[0];S.ai.cands=ok;S.ai.manual=false;save();return{ok:true,model:ok[0],cands:ok,tested}}
async function aiDirect(b,retried){
if(b.action=="status")return{ok:true,hasKey:true,model:S.ai.model||null,manual:!!S.ai.manual};
if(b.action=="models")return gmModels();
if(b.action=="test")return gmTest(String(b.model||""),b.prompt);
if(b.action=="setmodel"){S.ai.model=String(b.model||"");S.ai.cands=[S.ai.model].concat((S.ai.cands||[]).filter(x=>x!=S.ai.model)).slice(0,3);S.ai.manual=true;save();return{ok:true,model:S.ai.model}}
if(b.action=="select")return gmPick();
const msgs=[];(b.messages||[]).slice(-20).forEach(m=>{const role=m.r=="m"?"model":"user",t=String(m.t||"").slice(0,6000);if(!t)return;const l=msgs[msgs.length-1];if(l&&l.role==role)l.parts[0].text+="\n\n"+t;else msgs.push({role,parts:[{text:t}]})});
while(msgs.length&&msgs[0].role!="user")msgs.shift();
if(!msgs.length||msgs[msgs.length-1].role!="user")return{error:"bad_request",message:"Nothing to answer."};
let model=S.ai.model,cands=S.ai.cands||[];
if(!model){const s=await gmPick();if(s.error)return s;model=s.model;cands=s.cands}
const order=[model].concat(cands.filter(x=>x!=model)).slice(0,3);let last={code:0,json:{}};
for(const m of order){const body={systemInstruction:{parts:[{text:AI_SYS}]},contents:msgs,generationConfig:{temperature:.7,maxOutputTokens:4096}};
let r=b.search?await gmf("models/"+m+":generateContent",Object.assign({},body,{tools:[{google_search:{}}]})):null;if(!r||r.code==400)r=await gmf("models/"+m+":generateContent",body);
if(r.code==200){const t=gmText(r.json),br=r.json.promptFeedback&&r.json.promptFeedback.blockReason;return{ok:true,model:m,text:t||(br?"I can’t help with that request.":"No answer was returned. Please rephrase and try again.")}}
last=r;if([404,429,500,503].indexOf(r.code)<0)break}
if(last.code==404&&!retried){S.ai.model="";const s=await gmPick();if(!s.error)return aiDirect(b,true)}
if(last.code==429)return{error:"quota",message:"The free Gemini limit has been reached for now. Please try again in a few minutes."};
if(gmKeyBad(last))return{error:"key",message:"Gemini rejected the API key or its permissions. Check the key in Settings."};
return{error:"gemini",message:(last.json.error&&last.json.error.message)||"Gemini returned HTTP "+last.code+"."}}

async function gmModels(){const l=await gmf("models?pageSize=200");if(l.code!=200)return{error:l.code==429?"quota":gmKeyBad(l)?"key":"gemini",message:gmKeyBad(l)?"Gemini rejected the API key. Check that it is correct.":(l.json.error&&l.json.error.message)||"Could not list models (HTTP "+l.code+")."};
return{ok:true,models:(l.json.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,"")).filter(n=>/^gemini-/.test(n)&&!/(embedding|tts|image|audio|live)/.test(n)).sort((a,b)=>gmScore(b)-gmScore(a))}}
async function gmTest(m,pr){const t0=Date.now(),r=await gmf("models/"+m+":generateContent",{contents:[{role:"user",parts:[{text:String(pr||"Reply with the single word OK.").slice(0,500)}]}],generationConfig:{maxOutputTokens:256}}),ms=Date.now()-t0;
if(r.code==200)return{ok:true,model:m,ms,text:gmText(r.json)};
return{error:r.code==429?"quota":gmKeyBad(r)?"key":"gemini",code:r.code,ms,message:r.code==429?"This model’s free limit is reached.":gmKeyBad(r)?"Gemini rejected the API key.":(r.json.error&&r.json.error.message)||"HTTP "+r.code}}
function aiCur(){const e=$("ai_cur");if(e)e.textContent=S.ai.key?"Using: "+(S.ai.model||"not chosen yet")+(S.ai.manual?" (chosen by you)":" (auto)"):"Proxy mode: tap Test connection to see the saved model."}
async function aiLoad(){$("ai_mt").textContent="Loading models…";aiSave();aiCur();try{const j=await aiCall({action:"models"});if(!j.ok){$("ai_mt").textContent="⟦alert⟧ "+aiErr(j);return}
$("ai_m").innerHTML=j.models.map((m,i)=>`<option value="${esc(m)}" ${m==S.ai.model?"selected":""}>${esc(m)}${i==0?" (suggested)":""}</option>`).join("");$("ai_mt").textContent=j.models.length+" models available to your key. (suggested) marks the best pick for the free tier."}catch(e){$("ai_mt").textContent="⟦alert⟧ Could not connect."}}
async function aiMTest(){const m=$("ai_m").value;if(!m){$("ai_mt").textContent="Load models and pick one first.";return}$("ai_mt").textContent="Testing "+m+"…";
try{const j=await aiCall({action:"test",model:m,prompt:$("ai_mp").value.trim()});$("ai_mt").textContent=j.ok?"⟦checkc⟧ "+m+" answered in "+(j.ms/1000).toFixed(1)+" s:\n"+(j.text||"(empty reply)").slice(0,400):"⟦alert⟧ "+m+": "+aiErr(j)+(j.code?" (HTTP "+j.code+")":"")}catch(e){$("ai_mt").textContent="⟦alert⟧ Could not connect."}}
async function aiMUse(){const m=$("ai_m").value;if(!m){$("ai_mt").textContent="Load models and pick one first.";return}const k=S.ai.key?"local":await askInput({title:"Admin key needed",label:"Admin key (the proxy’s ADMIN_KEY property)",ok:"Use key",cancel:"Cancel"});if(!k)return;
try{const j=await aiCall({action:"setmodel",model:m,adminKey:k});$("ai_mt").textContent=j.ok?"⟦checkc⟧ Now using "+j.model+" for all answers.":"⟦alert⟧ "+aiErr(j);aiCur()}catch(e){$("ai_mt").textContent="⟦alert⟧ Could not connect."}}

const BQ="https://parishprieststores-byte.github.io/Brainquest/";
function rBQ(L){L.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:52px">⟦brain⟧</div><h2 style="margin:4px 0 10px;color:var(--acc)">BrainQuest – Learn, Think and Grow! ⟦brain⟧</h2><div style="text-align:left;margin-bottom:14px">BrainQuest is an interactive educational platform designed to stimulate the mind, strengthen reasoning, improve general knowledge and make learning engaging through questions, challenges and knowledge-based activities. It encourages curiosity, critical thinking and continuous intellectual development.</div>
<a href="${BQ}" target="_blank" rel="noopener noreferrer" style="display:block;font-size:20px;font-weight:bold;color:var(--acc);margin:6px 0 10px">⟦brain⟧ Explore BrainQuest – Tap Here ⟦down⟧</a>
<a href="${BQ}" target="_blank" rel="noopener noreferrer" style="display:block;text-decoration:none;text-align:center;background:var(--acc);color:var(--bg);border-radius:12px;padding:16px;font-size:20px;font-weight:bold">⟦brain⟧ Open BrainQuest</a>
<div class="meta" style="margin-top:14px">Link</div><code style="word-break:break-all">${BQ}</code><div style="margin-top:8px"><button class="sec sm" onclick="cpy('${BQ}')">Copy link</button></div>
<div class="row"><button type="button" class="hint" aria-label="More information" aria-expanded="false" onclick="tip(this)">⟦info⟧</button></div><div class="hintp" hidden>BrainQuest opens in your browser. Use the back button to return to Feed My Sheep. It needs an internet connection.</div></div>`}
function saveMax(){const v=Math.min(200,Math.max(1,Math.round(+$("as_max").value)||30));S.chal.max=v;if(HOST)HOST.fullSaid=false;save();render();note("Limit saved: "+v+" participants.")}
function quickGA(){form({date:`${year}-${String(month+1).padStart(2,"0")}-01`,status:"Planned",title:"Gathering of Angels",ministry:"Gathering of Angels"})}
function form(x){const sm=tab=="sermons",st=sm?SS:MS;x=x||{date:`${year}-${String(month+1).padStart(2,"0")}-01`,status:st[0]};
const f=(k,l,t="text")=>`<label>${l}</label><input id="f_${k}" type="${t}" value="${esc(x[k])}">`;
open_(`<h2 style="margin:0;color:var(--acc)">${x.id?"Edit":"New"} ${sm?"sermon":tab=="special"?"special service":"activity"}</h2>${f("title",sm?"Sermon title":"Activity name")}${f("date","Date","date")}${f("time","Time","time")}
${sm?f("scripture","Scripture (e.g. John 21:15-17)")+f("series","Series")+f("speaker","Preacher"):`<label>${tab=="special"?"Occasion":"Ministry"}</label><select id="f_ministry">${(tab=="special"?OCC:MIN).map(m=>`<option ${x.ministry==m?"selected":""}>${m}</option>`).join("")}</select>${f("location","Location")}${tab=="special"?f("speaker","Preacher / host"):""}`}
<label>Status</label><select id="f_status">${st.map(s=>`<option ${x.status==s?"selected":""}>${s}</option>`).join("")}</select>
<label>${sm?"Outline / notes":"Notes / people involved"}</label><textarea id="f_notes" rows="5">${esc(x.notes)}</textarea>
<div class="row" style="margin-top:14px"><button class="sec" onclick="close_()" style="flex:1">Cancel</button><button style="flex:1" onclick="saveF('${x.id||""}')">Save</button></div>`)}
function saveF(id){const g=k=>{const e=$("f_"+k);return e?e.value.trim():undefined};
const o={title:g("title"),date:g("date"),time:g("time"),scripture:g("scripture"),series:g("series"),speaker:g("speaker"),ministry:g("ministry"),location:g("location"),status:g("status"),notes:g("notes")};
if(!o.title){$("f_title").focus();return}
const A=arr();
if(id){Object.assign(A.find(x=>x.id==id),o)}else{o.id=Date.now().toString(36);A.push(o)}
if(o.date){year=yOf(o.date);month=mOf(o.date)}save();close_();render()}
function find(id){return arr().find(x=>x.id==id)}
function edit(id){form(find(id))}
function adv(id){const x=find(id),st=tab=="sermons"?SS:MS,i=st.indexOf(x.status);x.status=i==st.length-1?st[0]:st[i+1];save();render()}
async function del(id){if(!await ask({title:"Delete this item?",text:"It will be removed from the plan.",ok:"Delete item",cancel:"Keep it",danger:1}))return;const k=tab=="sermons"?"sermons":tab=="acts"?"acts":"special";S[k]=S[k].filter(x=>x.id!=id);save();render()}
function restore(){try{const d=JSON.parse($("bk").value);if(d.sermons&&d.acts){const kk=S.ai&&S.ai.key;S=d;S.special=S.special||[];S.people=S.people||[];S.cfg=S.cfg||{church:"",cc:"234"};norm();if(kk)S.ai.key=kk;save();render();note("Restored.")}else throw 0}catch(e){note("That backup text isn’t valid.")}}
$("add").onclick=()=>tab=="people"?pform():form();$("q").oninput=render;
$("yr").onchange=e=>{year=+e.target.value;render()};
const hm=/^#ch([0-9]+)$/.exec(location.hash);if(hm){S.chal.secs=Math.min(300,Math.max(5,+hm[1]));save()}
if(S.run&&!S.run.done){const r=S.run;if(r.live){r.left=true;r.done=true;r.end=Date.now();S.dqRid=r.rid;save()}else{r.ans.push(-1);r.i++;if(r.i>=r.qs.length)fin(r);else r.q0=Date.now();save()}}
if(S.run)tab="chal";
addEventListener("load",()=>{if(S.run&&S.run.live&&!S.run.solo&&!S.run.done)joinLive(true)});
render();
try{if(navigator.serviceWorker)navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!sessionStorage.getItem("fmsr")){sessionStorage.setItem("fmsr","1");location.reload()}})}catch(e){}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
