else if(w.length>1)para("The joint champions are "+w.map(r=>r.n).join(" and ")+" with "+w[0].s+" out of "+d.n+" ("+pc(w[0].s)+"%).").forEach(x=>L.push(x));
rows.filter(r=>r.rank>1&&r.rank<=3).forEach(r=>L.push({t:ord(r.rank)+" place: "+r.n+" - "+r.s+" / "+d.n,s:11,b:1,x:50}));
L.push({skip:6},hh("Highlights"));
const hl=["Participants: "+n,"Highest score: "+(n?Math.max(...sc):0)+" / "+d.n+"; lowest: "+(n?Math.min(...sc):0)+" / "+d.n,"Average score: "+avg.toFixed(1)+" / "+d.n+" ("+pc(avg)+"%)","Scored 80% or more: "+rows.filter(r=>pc(r.s)>=80).length+" participant(s)"];
if(sj.length>1)hl.push("Strongest subject: "+sj[0].c+" ("+sj[0].p+"% correct); needs most attention: "+sj[sj.length-1].c+" ("+sj[sj.length-1].p+"%)");
if(dqs.length)hl.push("Disqualified for leaving the app: "+dqs.map(r=>r.n).join(", "));
hl.forEach(t=>bl(t).forEach(x=>L.push(x)));
if(d.ties&&d.ties.length){L.push({skip:6},hh("Tie-breakers"));d.ties.forEach(t=>bl("Tie for "+t.place+" place between "+t.names.join(" and ")+". Tie-breaker scores: "+t.names.map(x=>x+" "+t.scores[x]).join(", ")+".").forEach(x=>L.push(x)))}
L.push({skip:6},hh("Final standings"),{cells:[[40,"Rank"],[85,"Name"],[330,"Score"],[395,"Percent"],[460,"Time (s)"]],b:1,s:10});
d.rows.forEach(r=>L.push({cells:r.dq?[[40,"DQ"],[85,r.n.slice(0,42)],[330,"Left the app during the challenge"]]:[[40,String(r.rank)],[85,r.n.slice(0,42)],[330,r.s+" / "+d.n],[395,pc(r.s)+"%"],[460,String(r.sec)]],s:10}));
L.push({skip:8},hh("Thank you"));
para("The organisers sincerely thank "+d.partner+" for their partnership and generous support of this challenge."+(sp.length?" We also thank our sponsors: "+sp.join(", ")+".":"")+" Thank you to every participant for your effort and honesty, and to all who helped make this event a success.").forEach(x=>L.push(x));
para("Feed my sheep. (John 21:17) May the Lord bless and reward you all.").forEach(x=>L.push(x));
L.push({skip:26},{t:"______________________________",s:11,x:40},{t:"Host / Administrator",s:10,x:40});return L}
function repText(d){const m=["🥇","🥈","🥉"];let t="🏆 *FEED MY SHEEP CHALLENGE*\nResults – "+d.at+"\n\n";d.rows.filter(r=>!r.dq).slice(0,10).forEach(r=>{t+=(r.rank<=3?m[r.rank-1]:r.rank+".")+" "+r.n+" – "+r.s+"/"+d.n+((r.tb||[]).length?" (tie-break "+r.tb.join("/")+")":"")+"\n"});
return t+"\nThank you to "+d.partner+(d.spons.length?" and our sponsors: "+d.spons.join(", "):"")+". God bless you all! 🙏"}
function dl(b,name){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},2000)}
async function shr(b,name,text){try{const f=new File([b],name,{type:b.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name,text});return}}catch(e){if(e&&e.name=="AbortError")return}dl(b,name);alert("This device can’t share files directly, so the file was downloaded. Attach it in WhatsApp.")}
function exp(kind,mode){if(HOST&&HOST.started)snap();const d=S.last;let b,name;const day=new Date().toISOString().slice(0,10);
if(kind=="xlsx"){const s=sheets(d);if(!s.length){alert("No results yet.");return}b=mkXlsx(s);name="FeedMySheep-Results-"+day+".xlsx"}
else if(kind=="pdf"){if(!(d&&d.rows.length)&&!S.results.length){alert("No results yet.");return}b=mkPdf(resLines(d));name="FeedMySheep-Results-"+day+".pdf"}
else{if(!(d&&d.rows.length)){alert("Run a challenge first.");return}b=mkPdf(repLines(d));name="FeedMySheep-Report-"+day+".pdf"}
mode=="share"?shr(b,name,"Feed My Sheep Challenge"):dl(b,name)}
function waText(){if(HOST&&HOST.started)snap();const d=S.last;if(!(d&&d.rows.length)){alert("No results yet.");return}open("https://wa.me/?text="+encodeURIComponent(repText(d)),"_blank")}
const exportCard=()=>`<div class="card"><h3>📤 Export &amp; share</h3><div class="meta">Results (PDF or Excel) and the special challenge report. Share opens WhatsApp or your phone’s share sheet; if files can’t be shared, they download instead.</div><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="sm" onclick="exp('pdf','share')">Share PDF</button><button class="sm" onclick="exp('xlsx','share')">Share Excel</button><button class="sm" onclick="exp('rep','share')">Share report</button><button class="sec sm" onclick="exp('pdf')">Download PDF</button><button class="sec sm" onclick="exp('xlsx')">Download Excel</button><button class="sec sm" onclick="exp('rep')">Download report</button><button class="sec sm" onclick="waText()">WhatsApp text</button></div></div>`;

let WL=null;
async function wake(){try{if(navigator.wakeLock&&!WL){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}}catch(e){}}
function unwake(){try{if(WL)WL.release()}catch(e){}WL=null}
function full(){try{const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(f&&!document.fullscreenElement){const r=f.call(e);if(r&&r.catch)r.catch(()=>{})}}catch(e){}}
function dq(n){const p=HOST&&HOST.players[n];if(!p||p.dq)return;p.dq=true;p.done=true;(HOST.left=HOST.left||[]).push(n);const t=HOST.tbRun;if(t&&t.names.includes(n)&&t.got[n]===undefined)t.got[n]=0;snap();board();up();if(t)checkTb()}
function leftNow(){const r=S.run;if(!r||!r.live||r.done)return;r.left=true;r.done=true;r.end=Date.now();clearInterval(TI);sendHost({t:"left"});S.dqRid=r.rid;save();try{if(P.peer){const pr=P.peer;setTimeout(()=>{try{pr.destroy()}catch(e){}},400)}}catch(e){}}
if(document.addEventListener){
document.addEventListener("visibilitychange",()=>{if(document.hidden)leftNow();else{if(S.run||HOST||P.conn)wake();if(S.run&&S.run.left){tab="chal";render()}}});
["contextmenu","copy","cut","selectstart","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target&&(e.target.nodeType==3?e.target.parentElement:e.target);if(t&&t.closest&&t.closest(".nocopy"))e.preventDefault()}))}
if(typeof addEventListener=="function")addEventListener("pagehide",leftNow);
function quickGA(){form({date:`${year}-${String(month+1).padStart(2,"0")}-01`,status:"Planned",title:"Gathering of Angels",ministry:"Gathering of Angels"})}
function form(x){const sm=tab=="sermons",st=sm?SS:MS;x=x||{date:`${year}-${String(month+1).padStart(2,"0")}-01`,status:st[0]};
const f=(k,l,t="text")=>`<label>${l}</label><input id="f_${k}" type="${t}" value="${esc(x[k])}">`;
open_(`<h2 style="margin:0;color:var(--acc)">${x.id?"Edit":"New"} ${sm?"sermon":tab=="special"?"special service":"activity"}</h2>${f("title",sm?"Sermon title":"Activity name")}${f("date","Date","date")}${f("time","Time","time")}
${sm?f("scripture","Scripture (e.g. John 21:15-17)")+f("series","Series")+f("speaker","Preacher"):`<label>${tab=="special"?"Occasion":"Ministry"}</label><select id="f_ministry">${(tab=="special"?OCC:MIN).map(m=>`<option ${x.ministry==m?"selected":""}>${m}</option>`).join("")}</select>${f("location","Location")}${tab=="special"?f("speaker","Preacher / host"):""}`}
<label>Status</label><select id="f_status">${st.map(s=>`<option ${x.status==s?"selected":""}>${s}</option>`).join("")}</select>
<label>${sm?"Outline / notes":"Notes / people involved"}</label><textarea id="f_notes" rows="5">${esc(x.notes)}</textarea>
<div class="row" style="margin-top:14px"><button class="sec" onclick="close_()" style="flex:1">Cancel</button><button style="flex:1" onclick="saveF('${x.id||""}')">Save</button></div>`)}
function saveF(id){const g=k=>{const e=$("f_"+k);return e?e.value.trim():undefined};
const o={title:g("title"),date:g("date"),time:g("time"),scripture:g("scripture"),series:g("series"),speaker:g("speaker"),ministry:g("ministry"),location:g("location"),status:g("status"),notes:g("notes")};
if(!o.title){$("f_title").focus();return}
const A=arr();
if(id){Object.assign(A.find(x=>x.id==id),o)}else{o.id=Date.now().toString(36);A.push(o)}
if(o.date){year=yOf(o.date);month=mOf(o.date)}save();close_();render()}
function find(id){return arr().find(x=>x.id==id)}
function edit(id){form(find(id))}
function adv(id){const x=find(id),st=tab=="sermons"?SS:MS,i=st.indexOf(x.status);x.status=i==st.length-1?st[0]:st[i+1];save();render()}
function del(id){if(!confirm("Delete this item?"))return;const k=tab=="sermons"?"sermons":tab=="acts"?"acts":"special";S[k]=S[k].filter(x=>x.id!=id);save();render()}
function restore(){try{const d=JSON.parse($("bk").value);if(d.sermons&&d.acts){S=d;S.special=S.special||[];S.people=S.people||[];S.cfg=S.cfg||{church:"",cc:"234"};norm();save();render();alert("Restored.")}else throw 0}catch(e){alert("That backup text isn’t valid.")}}
$("add").onclick=()=>tab=="people"?pform():form();$("q").oninput=render;
$("yr").onchange=e=>{year=+e.target.value;render()};
const hm=/^#ch([0-9]+)$/.exec(location.hash);if(hm){S.chal.secs=Math.min(300,Math.max(5,+hm[1]));save()}
if(S.run&&!S.run.done){const r=S.run;if(r.live){r.left=true;r.done=true;r.end=Date.now();S.dqRid=r.rid;save()}else{r.ans.push(-1);r.i++;if(r.i>=r.qs.length)fin(r);else r.q0=Date.now();save()}}
if(S.run)tab="chal";
addEventListener("load",()=>{if(S.run&&S.run.live&&!S.run.solo&&!S.run.done)joinLive(true)});
render();
try{if(navigator.serviceWorker)navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!sessionStorage.getItem("fmsr")){sessionStorage.setItem("fmsr","1");location.reload()}})}catch(e){}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
